
name: Test Pterodactyl Egg

on:
  push:
    branches:
      - master
      - staging
  pull_request:

jobs:
  test-egg-installation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq dos2unix

      - name: Extract installation info from egg
        id: install_info
        run: |
          INSTALL_SCRIPT_RAW=$(jq -r '.scripts.installation.script' egg-lavalink.json)
          INSTALL_CONTAINER=$(jq -r '.scripts.installation.container' egg-lavalink.json)
          LAVALINK_VERSION=$(jq -r '.variables[] | select(.env_variable == "LAVALINK_VERSION") | .default_value' egg-lavalink.json)

          echo "--- Extracted Info for Debugging ---"
          echo "Container Image: ${INSTALL_CONTAINER}"
          echo "Lavalink Version: ${LAVALINK_VERSION}"
          echo "------------------------------------"

          echo -e "$INSTALL_SCRIPT_RAW" | dos2unix > install_script.sh
          chmod +x install_script.sh

          echo "container_image=$INSTALL_CONTAINER" >> $GITHUB_OUTPUT
          echo "lavalink_version=$LAVALINK_VERSION" >> $GITHUB_OUTPUT

      - name: Run installation script in a simulated environment
        run: |
          mkdir -p ./temp_server_files

          docker run --rm \
            -v $(pwd)/install_script.sh:/mnt/install_script.sh \
            -v $(pwd)/temp_server_files:/mnt/server \
            -e LAVALINK_VERSION="${{ steps.install_info.outputs.lavalink_version }}" \
            ${{ steps.install_info.outputs.container_image }} \
            /mnt/install_script.sh

      - name: Verify installation
        run: |
          echo "Checking for installed files..."
          if [ -f "temp_server_files/Lavalink.jar" ] && [ -f "temp_server_files/application.yml" ]; then
            echo "Installation successful: Lavalink.jar and application.yml were created."
            JAR_SIZE=$(du -sh temp_server_files/Lavalink.jar | cut -f1)
            echo "Lavalink.jar size: $JAR_SIZE"
          else
            echo "Installation failed: Required files were not found."
            ls -l temp_server_files
            exit 1
          fi

  validate-egg-docker-images:
    runs-on: ubuntu-latest
    needs: test-egg-installation
    if: github.ref_name == 'master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check if Docker images from egg.json exist
        run: |
          DOCKER_IMAGES=$(jq -r '.docker_images | to_entries[] | .value' egg-lavalink.json)
          for IMAGE in $DOCKER_IMAGES; do
            echo "Verifying image exists: $IMAGE"
            docker pull "$IMAGE"
            echo "OK: $IMAGE"
          done
