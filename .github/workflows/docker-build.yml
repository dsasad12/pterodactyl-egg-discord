
name: Build and Push Docker Image

on:
  push:
    branches:
      - master
      - staging
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: 5140/lavalink-egg:latest

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 5140/lavalink-egg:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Test the Docker image
        run: |
          output=$(docker run --rm \
            -v ${{ github.workspace }}/projectdefaults/application.yml:/home/container/application.yml \
            -e STARTUP="java -version" \
            5140/lavalink-egg:latest 2>&1 || true)
          echo "Container output: $output"
          if echo "$output" | grep -q "openjdk\|java version\|Starting Lavalink"; then
            echo "Test passed: Java is available in the container."
          else
            echo "Test failed: Java not detected. Output was: $output"
            exit 1
          fi

      - name: Push the Docker image
        if: github.ref == 'refs/heads/master'
        run: docker push 5140/lavalink-egg:latest

  build-test-and-push-snapshot:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: 5140/lavalink-egg:snapshot

      - name: Push the Docker image
        run: docker push 5140/lavalink-egg:snapshot
